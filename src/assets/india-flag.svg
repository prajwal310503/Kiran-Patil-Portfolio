<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <!-- Saffron top band -->
  <rect x="0" y="0" width="100" height="33.33" fill="#FF9933" clip-path="url(#circle)"/>
  <!-- White middle band -->
  <rect x="0" y="33.33" width="100" height="33.34" fill="#FFFFFF" clip-path="url(#circle)"/>
  <!-- Green bottom band -->
  <rect x="0" y="66.67" width="100" height="33.33" fill="#138808" clip-path="url(#circle)"/>

  <!-- Ashoka Chakra (Navy blue circle) -->
  <circle cx="50" cy="50" r="8.5" fill="none" stroke="#000080" stroke-width="1.2" clip-path="url(#circle)"/>
  <!-- Hub -->
  <circle cx="50" cy="50" r="1.2" fill="#000080" clip-path="url(#circle)"/>

  <!-- 24 spokes -->
  <g stroke="#000080" stroke-width="0.8" clip-path="url(#circle)">
    <line x1="50" y1="41.5" x2="50" y2="58.5"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(15 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(30 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(45 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(60 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(75 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(90 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(105 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(120 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(135 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(150 50 50)"/>
    <line x1="50" y1="41.5" x2="50" y2="58.5" transform="rotate(165 50 50)"/>
  </g>

  <!-- Circular border -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="#ccc" stroke-width="1"/>
</svg>
